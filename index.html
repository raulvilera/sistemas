{t:'d',g:'Grupo 3',x:'Um teste de ancestralidade gerou o relatório ao lado (dados fictícios). Explique por que ele não comprova a existência de "raças" biológicas humanas e aponte um risco à privacidade genética.',i:barras([['Africana subsaariana',40],['Europeia',35],['Indígena americana',25]],50,' %')}
];
// ===== Renderização =====
const L='ABCDE';
document.getElementById('qs').innerHTML=Q.map((q,n)=>`<div class="card q"><h3>Questão ${n+1}</h3><p>${q.x}</p>${q.c?`<p class="cmd">${q.c}</p>`:''}<div class="img">${q.i}${renderFotos(q.fotos)}</div>`+
(q.t=='o'?q.a.map((a,k)=>`<div class="alternativa" data-q="${n}" data-l="${L[k]}"><b>${L[k]})</b> ${a}</div>`).join(''):`<textarea id="d${n}" placeholder="Escreva sua resposta aqui"></textarea>`)+'</div>').join('');
const R={};
document.querySelectorAll('.alternativa').forEach(e=>e.onclick=()=>{document.querySelectorAll(`.alternativa[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.remove('selecionada'));e.classList.add('selecionada');R[e.dataset.q]=e.dataset.l});
// Cascata Turma > Nome > RA
const tS=document.getElementById('turma'),nS=document.getElementById('nome'),ra=document.getElementById('ra'),num=document.getElementById('num'),em=document.getElementById('email'),dt=document.getElementById('data');
dt.value=new Date().toLocaleDateString('pt-BR');
Object.keys(ALUNOS).forEach(t=>tS.add(new Option(t,t)));
tS.onchange=()=>{nS.length=1;ra.value=num.value=em.value='';nS.disabled=!tS.value;nS.options[0].text=tS.value?'Selecione seu nome':'Selecione a turma primeiro';(ALUNOS[tS.value]||[]).forEach(a=>nS.add(new Option(a.n,a.n)))};
nS.onchange=()=>{const a=(ALUNOS[tS.value]||[]).find(x=>x.n==nS.value);ra.value=a?a.ra:'';num.value=a?a.num:'';em.value=a?a.email:''};
// Envio
document.getElementById('enviar').onclick=async function(){
 const m=document.getElementById('msg');
 if(!tS.value||!nS.value)return m.textContent='Selecione turma e nome.';
 const resp={};Q.forEach((q,n)=>resp['q'+(n+1)]=q.t=='o'?(R[n]||''):document.getElementById('d'+n).value.trim());
 const vazias=Object.values(resp).filter(v=>!v).length;
 if(vazias&&!confirm(`Há ${vazias} questão(ões) sem resposta. Enviar assim mesmo?`))return;
 this.disabled=true;m.textContent='Enviando e corrigindo... aguarde, pode levar alguns segundos.';
 try{const r=await fetch(URL_APPS_SCRIPT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({turma:tS.value,nome:nS.value,ra:ra.value,num:num.value,email:em.value,data:dt.value,respostas:resp})});
  if(!r.ok)throw 0;m.textContent='✅ Respostas enviadas com sucesso!';}
 catch(e){m.textContent='❌ Não foi possível enviar. Verifique a conexão e tente novamente.';this.disabled=false}
};
</script></body></html>
